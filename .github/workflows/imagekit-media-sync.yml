name: ImageKit media sync

on:
  workflow_dispatch:
  push:
    paths:
      - 'media-staging/**'
      - 'media-bundles/**'
      - 'media/**'
      - 'scripts/mediaManifest.mjs'
      - 'scripts/prepareMediaBundles.mjs'
      - 'scripts/validateMediaManifest.mjs'
      - 'scripts/syncImageKitMedia.mjs'
      - 'src/config/mediaConfig.js'
      - 'src/core/mediaAsset.js'
      - 'src/core/mediaCatalog.js'
      - 'src/data/workbooks/gs23/g2-media.js'
      - 'src/services/lessonMediaService.js'
      - '.github/workflows/imagekit-media-sync.yml'
  pull_request:
    paths:
      - 'media-staging/**'
      - 'media-bundles/**'
      - 'media/**'
      - 'scripts/mediaManifest.mjs'
      - 'scripts/prepareMediaBundles.mjs'
      - 'scripts/validateMediaManifest.mjs'
      - 'scripts/syncImageKitMedia.mjs'
      - 'src/config/mediaConfig.js'
      - 'src/core/mediaAsset.js'
      - 'src/core/mediaCatalog.js'
      - 'src/data/workbooks/gs23/g2-media.js'
      - 'src/services/lessonMediaService.js'
      - '.github/workflows/imagekit-media-sync.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: imagekit-media-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-sync:
    name: Validate and sync ImageKit media
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate immutable media manifest
        run: node scripts/validateMediaManifest.mjs

      - name: Choose smoke, preview or production namespace
        id: mode
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "mode=production" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" == "$GITHUB_REPOSITORY" ]]; then
            echo "mode=preview" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "mode=preview" >> "$GITHUB_OUTPUT"
          else
            echo "mode=smoke" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload and verify ImageKit assets
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
        run: node scripts/syncImageKitMedia.mjs --mode "${{ steps.mode.outputs.mode }}" --ref "$GITHUB_SHA"

      - name: Fork PR media note
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "Fork PR validated manifest only; repository secrets and ImageKit upload are intentionally unavailable."

      - name: Publish auditable ImageKit media status on main
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE="failure"
          DESCRIPTION="Canonical ImageKit image/audio sync failed"
          if [[ "$JOB_STATUS" == "success" ]]; then
            STATE="success"
            DESCRIPTION="Canonical ImageKit image/audio sync verified"
          fi
          PAYLOAD=$(printf '{"state":"%s","context":"ImageKit media","description":"%s","target_url":"%s/%s/actions/runs/%s"}' "$STATE" "$DESCRIPTION" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "$PAYLOAD" >/dev/null
