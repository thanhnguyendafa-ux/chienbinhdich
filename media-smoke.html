<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Media pipeline smoke · Chiến Binh Dịch</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;background:#f4f7fb;color:#243746}.wrap{max-width:820px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #d9e2ec;border-radius:18px;padding:20px;margin:16px 0}.card img{display:block;max-width:100%;height:auto;border-radius:14px}.card audio{width:100%;margin-top:12px}.ok{color:#126b3a;font-weight:700}.pending{color:#7a5c00;font-weight:700}code{word-break:break-all}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>ImageKit media pipeline smoke</h1>
    <p>Trang chẩn đoán này đọc cùng MEDIA_BASE và media manifest mà pipeline production sử dụng.</p>
    <section class="card"><h2>Ảnh</h2><p id="image-status" class="pending">Đang tải…</p><img id="smoke-image" alt="" /><code id="image-url"></code></section>
    <section class="card"><h2>Audio local</h2><p id="audio-status" class="pending">Đang tải…</p><audio id="smoke-audio" controls preload="metadata"></audio><code id="audio-url"></code></section>
  </main>
  <script type="module">
    import { mediaManifest } from '/media/manifest.js';
    import { mediaAssetUrl } from '/src/core/mediaAsset.js';
    const imageAsset = mediaManifest.assets.find(asset => asset.kind === 'image');
    const audioAsset = mediaManifest.assets.find(asset => asset.kind === 'audio');
    const imageUrl = mediaAssetUrl(imageAsset.remotePath);
    const audioUrl = mediaAssetUrl(audioAsset.remotePath);
    const image = document.querySelector('#smoke-image');
    const audio = document.querySelector('#smoke-audio');
    image.alt = imageAsset.alt;
    image.src = imageUrl;
    audio.src = audioUrl;
    document.querySelector('#image-url').textContent = imageUrl;
    document.querySelector('#audio-url').textContent = audioUrl;
    image.addEventListener('load', () => { const el=document.querySelector('#image-status'); el.textContent='PASS · ảnh tải được'; el.className='ok'; });
    image.addEventListener('error', () => { document.querySelector('#image-status').textContent='FAIL · ảnh không tải được'; });
    audio.addEventListener('loadedmetadata', () => { const el=document.querySelector('#audio-status'); el.textContent='PASS · audio tải metadata được'; el.className='ok'; });
    audio.addEventListener('error', () => { document.querySelector('#audio-status').textContent='FAIL · audio không tải được'; });
  </script>
</body>
</html>
